# Number of targets and antitargets to select
protein_selection:
  num_antitargets: 2

# Parameters for validating and scoring molecules
molecule_validation:
  # Scoring weights for target/antitarget binding
  antitarget_weight: 0.9
  # Scoring weights for entropy
  entropy_min_threshold: 0.25
  # Pairwise-diversity rule: reject the entire submission if any two molecules
  # have Morgan (ECFP4, 2048-bit) Tanimoto similarity >= this threshold.
  # 1.0 effectively disables the rule; lower values enforce more diversity.
  tanimoto_max_threshold: 0.9

  # Molecular property requirements
  min_heavy_atoms: 20
  min_rotatable_bonds: 1
  max_rotatable_bonds: 10
  # Number of molecules to validate with PSICHIC
  num_molecules: 100

# Reaction filtering configuration
reaction_filtering:
  random_valid_reaction: false  # true = one random reaction per epoch, false = all reactions valid

run:
  time_budget_sec: 900
  # One competition every day (UTC-aligned)
  competition_interval_seconds: 86400
  # Consecutive epochs a frozen challenger must beat the champion to be promoted.
  wins_required: 3
  # Absolute score margin a challenger must clear to beat the champion.
  improvement_margin: 0.01
  # If set, this UID receives the configured override share of weights.
  emission_target_override_uid: 54
  # Fraction of non-burn weights to route to the override UID
  emission_target_override_share: 1.0


