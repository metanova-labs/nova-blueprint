# Number of targets and antitargets to select
protein_selection:
  num_antitargets: 2

# Parameters for validating and scoring molecules
molecule_validation:
  # Scoring weights for target/antitarget binding
  antitarget_weight: 0.9
  # Scoring weights for entropy
  entropy_min_threshold: 0.25

  # Molecular property requirements
  min_heavy_atoms: 20
  min_rotatable_bonds: 1
  max_rotatable_bonds: 10
  # Number of molecules to validate with PSICHIC
  num_molecules: 100

# Reaction filtering configuration
reaction_filtering:
  random_valid_reaction: true  # true = one random reaction per epoch, false = all reactions valid

run:
  time_budget_sec: 900
  # One competition every day (UTC-aligned)
  competition_interval_seconds: 86400
  # Initial minimum absolute improvement required to replace previous winner (e.g., 0.05 ~ 5%)
  min_improvement_margin: 0.03
  # Relative decay of the improvement margin per epoch/day (e.g., 0.2 = 20% decay -> 80% of previous each epoch)
  min_improvement_decay_rate: 0.0285
  # If set, this UID receives the configured override share of weights.
  emission_target_override_uid: 54
  # Fraction of non-burn weights to route to the override UID
  emission_target_override_share: 1.0


