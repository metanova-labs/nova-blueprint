name: nova-blueprint

services:
  nova-blueprint:
    image: ${VALIDATOR_IMAGE:-shadeform/nova-blueprint:latest}
    container_name: nova-blueprint
    restart: "no"
    working_dir: /app
    gpus: all
    env_file:
      - .env
    volumes:
      - ${BT_WALLETS_DIR:-$HOME/.bittensor/wallets}:/wallets:ro
      - ./results:/app/results
    command: ["python", "neurons/validator/validator.py", "--logging.info"]

