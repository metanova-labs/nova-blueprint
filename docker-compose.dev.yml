name: nova-blueprint-dev

services:
  nova-blueprint:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: nova-blueprint:dev
    container_name: nova-blueprint-dev
    restart: "no"
    working_dir: /app
    gpus: all
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./:/app:rw
      - ${BT_WALLETS_DIR:-$HOME/.bittensor/wallets}:/root/.bittensor/wallets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    entrypoint: ["python", "neurons/validator/scheduler.py"]
    command: ["--wallet.name", "${BT_WALLET_COLD}", "--wallet.hotkey", "${BT_WALLET_HOT}", "--logging.debug"]
