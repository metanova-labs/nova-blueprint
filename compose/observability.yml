name: observability
services:
  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning
      - grafana-storage:/var/lib/grafana
    depends_on:
      - loki

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
    volumes:
      - ../ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    depends_on:
      - grafana

volumes:
  loki-data:
  grafana-storage:
  caddy_data:
  caddy_config:




